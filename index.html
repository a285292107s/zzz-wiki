<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- CJK 衬线分片 @font-face：独立 link（勿并入主 CSS——postcss @import 内联会把
         202 条 face 打进主包，74KB gzip 阻塞渲染；link 独立缓存且并行加载） -->
    <link rel="stylesheet" href="/fonts/noto-serif-sc.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="绝区零（Zenless Zone Zero）数据档案 · 代理人、音擎、邦布与驱动盘结构化图鉴" />
    <title>绳网档案 · 绝区零数据图鉴</title>
    <!-- 移动端浏览器 chrome 染页面底色（--bg-0 同值） -->
    <meta name="theme-color" content="#0d0f11" />
    <!-- 社交卡片：SPA 静态 head，全站共用一份（页面级标题由 usePageMeta 动态改 document.title）。
         og:image 必须为绝对 URL（多数爬虫不解析相对路径）——origin 由部署域注入（vercel-env.sh 的
         VITE_SITE_ORIGIN），这里写 Vercel 生产默认域作静态兜底，与 robots.txt 的 Sitemap 同域。 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="绳网档案" />
    <meta property="og:title" content="绳网档案 · 绝区零数据图鉴" />
    <meta property="og:description" content="以档案编号为纲的绝区零结构化资料库：代理人、音擎、邦布与驱动盘，客观陈列，不含主观评述。" />
    <meta property="og:image" content="https://zzz-wiki.vercel.app/home-bg.webp" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1080" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- canonical/og:url 的 origin 由 usePageMeta 按部署域动态维护（见该文件 SITE_ORIGIN）；此处仅兜底 -->
    <link rel="canonical" href="/" />
    <!-- 字体预加载：@font-face 经 CSS 才被发现，晚到必触发 swap 重排（页脚/编号文字跳位，CLS）。
         只预载首屏实际命中的 400 字重；preload 不匹配 (as="font") 会报 console 警告，增删须同步 tokens.css。 -->
    <link rel="preload" href="/fonts/PublicSans-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/JetBrainsMono-400.woff2" as="font" type="font/woff2" crossorigin />
    <!-- 关键名录 JSON 预取：首页今日角色 / 代理人名录的首屏链路是 JS → 取清单 → 渲染 → 取图，
         预取让清单请求与 JS 加载并行，砍掉一整段串行 RTT（移动模拟 LCP 的主项）。
         SPA 各路由共用本 head：非代理人路由多耗一份缓存友好的同源请求，换取两个高频页面链路减一。 -->
    <link rel="preload" href="/data/manifest.json" as="fetch" crossorigin />
    <link rel="preload" href="/data/live/character.json" as="fetch" crossorigin />
    <!-- 今日角色头图不走静态预取：四张按**访客本地日期**从 61 张里确定性挑选，
         构建期无从得知是哪四张（旧文案写「挂载期随机」已与实现不符）；
         确定性预热在 useFeaturedAgents（挂载即 img.decode，走同一份 srcset/sizes）。 -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
