<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="绝区零（Zenless Zone Zero）数据档案 · 代理人、音擎、邦布与驱动盘结构化图鉴" />
    <title>绳网档案 · 绝区零数据图鉴</title>
    <script>
      // 首页 LCP：hero 是 CSS background-image，浏览器默认不会提前加载；
      // 在此按首页路径条件预取并标记高优先级，其它页面落地时不白下载。
      if (location.pathname === '/') {
        const l = document.createElement('link')
        l.rel = 'preload'
        l.as = 'image'
        l.href = '/data/img/hero/Mindscape_1311_2.webp'
        l.fetchPriority = 'high'
        document.head.appendChild(l)
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
